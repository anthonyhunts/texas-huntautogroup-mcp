[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huntautogroup-texas"
version = "1.1.0"
description = "MCP server, CLI and Python SDK for Hunt Auto Group Texas used-car data (NHTSA recalls, crash stars, EPA MPG). Read-only, no key."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Anthony Hunt" }]
keywords = ["mcp", "mcp-server", "model-context-protocol", "cli", "sdk", "used cars", "texas", "nhtsa", "recalls", "epa"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://texas.huntautogroup.com/developers/"
Documentation = "https://texas.huntautogroup.com/developers/"
Source = "https://github.com/anthonyhunts/texas-huntautogroup-mcp"
Issues = "https://github.com/anthonyhunts/texas-huntautogroup-mcp/issues"

[project.scripts]
huntautogroup-texas = "huntautogroup_texas.cli:main"
huntautogroup-texas-mcp = "huntautogroup_texas.mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/huntautogroup_texas"]
